// FUNCIÓN: CAMBIAR DISCIPLINA
// ═══════════════════════════════════════════════════════════════
function cambiarDisciplina() {
  const disciplina = document.getElementById('disciplina').value;
  const contenedor = document.getElementById('contenedorFases');
  contenedor.innerHTML = '';

  if (!disciplina) return;

  const cat = catalogo[disciplina];

  contenedor.innerHTML += generarFase(cat.f1);
  contenedor.innerHTML += generarFase(cat.f2);
  contenedor.innerHTML += generarFase(cat.f3);
  contenedor.innerHTML += generarFase(cat.f4);
}

function generarFase(fase) {
  let html = `<div class="fase">
    <div class="fase-title">${fase.titulo} <span>Peso: ${(fase.peso*100)}%</span></div>`;

  fase.campos.forEach(campo => {
    html += `<label>${campo.label}</label>`;
    if (campo.tipo === "number") {
      html += `<input type="number" id="${campo.id}" value="${campo.value}" min="0">`;
    } else {
      html += `<select id="${campo.id}">`;
      campo.opciones.forEach(opt => {
        html += `<option value="${opt.v}">${opt.t}</option>`;
      });
      html += `</select>`;
    }
  });

  html += `</div>`;
  return html;
}

// ═══════════════════════════════════════════════════════════════
// FUNCIÓN: CALCULAR CON PUNTAJES RECALIBRADOS
// ═══════════════════════════════════════════════════════════════
function calcular() {
  const disciplina = document.getElementById('disciplina').value;
  if (!disciplina) {
    alert("⚠️ Selecciona una disciplina primero");
    return;
  }

  const cat = catalogo[disciplina];

  function leer(id) {
    const el = document.getElementById(id);
    return el ? parseFloat(el.value) || 0 : 0;
  }

  // FASE 1 · Concepto (peso 20%)
  const f1Humana = (leer('concepto') + leer('direccion')) * cat.f1.peso;

  // FASE 2 · Dirección (peso 15%) · Prompt inicial 6pts, iterativo 3pts
  const f2Humana = ((leer('promptsIniciales') * 6) + (leer('promptsIterativos') * 3)) * cat.f2.peso;

  // FASE 3 · Producción (peso 40%) · IA 3pts, hora edición 12pts
  const f3IA = leer('activosIA') * 3 * cat.f3.peso;
  const f3Humana = leer('horasEdicion') * 12 * cat.f3.peso;

  // FASE 4 · Curación (peso 25%)
  let f4Humana = leer('curacion') * cat.f4.peso;
  const grabacion = leer('grabacion') || leer('rodaje');
  if (grabacion) f4Humana += grabacion * cat.f4.peso;

  // TOTALES
  const PHP = f1Humana + f2Humana + f3Humana + f4Humana;
  const PTP = PHP + f3IA;
  let ah = (PHP / PTP) * 100;
  ah = Math.min(ah, 100).toFixed(2);

  const resBox = document.getElementById('resultadoBox');
  resBox.style.display = "block";

  if (ah >= 75) {
    // ORO / PLATINO
    resBox.className = "result success";
    resBox.innerHTML = `
      <div style="font-size: 1.6em; margin-bottom: 15px;">✅ ${ah}% Humano</div>
      <div style="margin-bottom: 15px; font-size: 1.05em;">Tu obra califica para la Soberanía Autoral SCDR-001.</div>
      <div style="font-size: 1em; opacity: 0.9; margin-bottom: 20px;">Nivel: <strong>${getNivel(ah)}</strong></div>
      <a href="https://mpago.la/1WymNWS" class="cta-btn" target="_blank">▸ Certificar con Hash Blockchain ($99)</a>
    `;
  } else if (ah >= 51) {
    // BRONCE / PLATA
    resBox.className = "result warning";
    resBox.innerHTML = `
      <div style="font-size: 1.6em; margin-bottom: 15px;">⚠️ ${ah}% Humano</div>
      <div style="margin-bottom: 15px; font-size: 1.05em;">Alcanzas el mínimo para certificar.</div>
      <div style="font-size: 1em; opacity: 0.9; margin-bottom: 20px;">Nivel: <strong>${getNivel(ah)}</strong></div>
      <div style="font-size: 0.9em; opacity: 0.8; margin-bottom: 20px;">Para subir a Oro necesitas más horas de edición manual o curación compleja.</div>
      <a href="https://mpago.la/1WymNWS" class="cta-btn" target="_blank">▸ Certificar ($99)</a>
    `;
  } else {
    // NO CERTIFICABLE
    resBox.className = "result danger";
    resBox.innerHTML = `
      <div style="font-size: 1.6em; margin-bottom: 15px;">❌ ${ah}% Humano</div>
      <div style="margin-bottom: 15px; font-size: 1.05em;">No alcanzas el mínimo del 51% requerido.</div>
      <div style="font-size: 0.95em; opacity: 0.85; line-height: 1.7;">
        <strong>¿Cómo subir tu porcentaje?</strong><br>
        ▸ Aumenta horas de edición manual<br>
        ▸ Haz curación compleja (+100 opciones)<br>
        ▸ Define mejor tu concepto original<br>
        ▸ Escribe más prompts iterativos
      </div>
    `;
  }
}

function getNivel(ah) {
  if (ah >= 90) return "💎 PLATINO";
  if (ah >= 75) return "🥇 ORO";
  if (ah >= 60) return "🥈 PLATA";
  return "🥉 BRONCE";
}
